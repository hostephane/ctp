version: 2

models:
  - name: fct_orders
    description: "One row per order with gross, refunded and net revenue. Source of the Sales dashboard and the Finance report."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: sales
      tier: gold
    columns:
      - name: order_id
        description: "Unique order identifier (primary key)."
        data_tests: [unique, not_null]
      - name: net_revenue_eur
        description: "{{ doc('net_revenue') }}"
        # TODO (Exercise 3): replace with the glossary term net_revenue using the doc() function
      # TODO: document the other columns
      - name: customer_id
        description: "Foreign key referencing dim_customers.customer_id."
        data_tests: [not_null]
      - name: order_date
        description: "Date or timestamp when the order was placed."
      - name: status
        description: "Current lifecycle status of the order."
        data_tests:
          - accepted_values:
              values: ['pending', 'shipped', 'delivered', 'cancelled', 'returned']
      - name: channel
        description: "Sales channel through which the order was placed."
      - name: shipping_country
        description: "Destination country code for order delivery."
      - name: gross_revenue_eur
        description: "Total gross order amount in EUR (including VAT)."
      - name: refunded_eur
        description: "Total refunded amount in EUR for the order."

  - name: dim_customers
    description: "One row per customer with lifetime metrics."
    # TODO: meta owner / steward / domain / tier, column docs, PII tags
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: customer
      tier: gold
    config:
      tags: ['pii']
    columns:
      - name: customer_id
        description: "Unique customer identifier (primary key)."
        data_tests: [unique, not_null]
      - name: first_name
        description: "Customer first name."
        config:
          tags: ['pii']
        meta: {classification: confidential}
      - name: last_name
        description: "Customer last name."
        config:
          tags: ['pii']
        meta: {classification: confidential}
      - name: email
        description: "Customer email address."
        config:
          tags: ['pii']
        meta: {classification: confidential}
      - name: country_code
        description: "Customer ISO country code."
        data_tests:
          - accepted_values:
              values: ['FR', 'DE', 'ES', 'BE']
      - name: loyalty_tier
        description: "Customer loyalty program level."
        data_tests:
          - accepted_values:
              values: ['bronze', 'silver', 'gold', 'platinum']
      - name: signup_date
        description: "Date when the customer account was created."
      - name: has_marketing_consent
        description: "Boolean flag indicating whether the customer opted in to marketing."
      - name: lifetime_orders
        description: "Total number of orders placed by the customer."
      - name: last_order_date
        description: "Date of the customer's most recent order."
      - name: lifetime_net_revenue_eur
        description: "Cumulative net revenue in EUR generated by the customer."