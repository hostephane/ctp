version: 2

# Exposures = the things OUTSIDE dbt that use our models (dashboards, reports, ML models).
# They appear at the end of the lineage graph: impact analysis starts here.
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily revenue, orders and conversion per channel. Opened every morning by the CEO."

  # TODO (Exercise 2): add the Finance monthly revenue report (depends on fct_orders)
  - name: finance_monthly_revenue_report
    label: Finance monthly revenue report
    type: analysis
    maturity: high
    owner:
      name: Claire Dubois
      email: claire.dubois@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Monthly gross, refunded, and net revenue report used by Finance for closing and reporting."

  # TODO (Exercise 2): add the churn-prediction ML model (depends on dim_customers)
  - name: churn_prediction_ml_model
    label: Churn prediction ML model
    type: ml
    maturity: medium
    owner:
      name: Karim Benali
      email: karim.benali@shopfast.example
    depends_on:
      - ref('dim_customers')
    description: "Machine learning model predicting customer churn based on customer profile and lifetime metrics."